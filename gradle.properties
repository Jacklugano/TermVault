org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# NB: AGP 8.13 richiede un JDK 17-21 (non 22+). Se il tuo JAVA_HOME predefinito
# è più recente, punta Gradle a un JDK compatibile in modo NON versionato, ad es.
# in ~/.gradle/gradle.properties oppure con --gradle-java-home / -Dorg.gradle.java.home.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
